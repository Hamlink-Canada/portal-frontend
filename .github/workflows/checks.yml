name: checks
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tags
        env:
          REF: ${{ github.event.release.tag_name || github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ github.event_name == 'release' }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          image=ghcr.io/hamlink-canada/portal-frontend
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "$image:sha-$SHA" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = true ]; then
            if ! printf '%s' "$REF" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
              echo 'Invalid release version' >&2
              exit 1
            fi
            version=${REF#v}
            echo "$image:$version" >> "$GITHUB_OUTPUT"
            if [ "$PRERELEASE" != true ] && ! printf '%s' "$version" | grep -q -- '-'; then
              echo "$image:latest" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo EOF >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
